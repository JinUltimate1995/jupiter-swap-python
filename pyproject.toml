[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jupiter-swap-python"
version = "0.2.0"
description = "Async Python client for the Jupiter DEX aggregator on Solana — Swap API (quote/swap) and Ultra API."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "JinUltimate1995" }]
keywords = [
    "jupiter",
    "solana",
    "dex",
    "swap",
    "defi",
    "python",
    "async",
    "trading",
    "aggregator",
    "crypto",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/JinUltimate1995/jupiter-swap-python"
Repository = "https://github.com/JinUltimate1995/jupiter-swap-python"
Issues = "https://github.com/JinUltimate1995/jupiter-swap-python/issues"
Changelog = "https://github.com/JinUltimate1995/jupiter-swap-python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["jupiter_swap"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
